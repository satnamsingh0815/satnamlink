<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SatnamLink | URL Shortener</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            padding: 22px;
            background: #ffffff;
            font-size: 25px;
            font-weight: bold;
            text-align: center;
        }

        main {
            max-width: 600px;
            margin: 80px auto;
            padding: 25px;
            text-align: center;
        }

        h1 {
            font-size: 38px;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        .box {
            margin-top: 30px;
            padding: 25px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px #0000000d;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #dbe2ea;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <header>SatnamLink</header>

    <main>
        <h1>Shorten Your Links.</h1>

        <p>
            Make your long URLs short, simple and easy to share.
        </p>

        <div class="box">
            <input
                type="url"
                placeholder="https://example.com/your-long-link"
                aria-label="Long URL"
            >

            <button type="button" onclick="showMessage()">
                Shorten Link
            </button>

            <p id="message"></p>
        </div>
    </main>

    <footer>
        © 2026 SatnamLink
    </footer>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "Welcome to SatnamLink! Link shortening will be added next.";
        }
    </script>

</body>
</html>
